set -g base-index 1
set -g mouse on
set -s escape-time 0
set -g mode-keys vi

# Map Alt+Ctrl+Left to move to the previous window
bind-key -n C-M-Left previous-window

# Map Alt+Ctrl+Right to move to the next window
bind-key -n C-M-Right next-window

# Ensure colors render correctly in Kitty
set -g default-terminal "xterm-kitty"
set -ga terminal-overrides ",xterm-kitty:Tc"

set -g allow-passthrough on
set -g focus-events on
