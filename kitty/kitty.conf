# Shell
shell /bin/zsh

# Fonts
font_family 		auto
bold_font 		auto
italic_font 		auto
bold_italic_font	auto

font_size 20.0

force_ltr no

font_features none

# Cursors
cursor #d4d7ff

cursor_shape block
cursor_underline_thickness 1.5

cursor_blink_interval .0

shell_integration  no-cursor

# Scrollback
scrollback_lines 2000

scrollback_fill_enlarged_window no

wheel_scroll_multiplier 8.0

wheel_scroll_min_lines 1

# Terminal bell
enable_audio_bell no

background_opacity 1.0
background_tint 1.0
dim_opacity 0.75
macos_option_as_alt yes

map ctrl+shift+o no_op
map ctrl+shift+f no_op

hide_window_decorations titlebar-only

include theme.conf

# Layouts (stack = maximized split)
enabled_layouts splits,stack

# Splits (new split inherits cwd; left/up = split then swap)
map cmd+alt+right launch --location=vsplit --cwd=current
map cmd+alt+left  combine : launch --location=vsplit --cwd=current : move_window left
map cmd+alt+down  launch --location=hsplit --cwd=current
map cmd+alt+up    combine : launch --location=hsplit --cwd=current : move_window up

# Focus
map ctrl+shift+right neighboring_window right
map ctrl+shift+left  neighboring_window left
map ctrl+shift+down  neighboring_window down
map ctrl+shift+up    neighboring_window up

# Resize (border moves in arrow direction, see resize.py)
map alt+shift+right kitten resize.py right
map alt+shift+left  kitten resize.py left
map alt+shift+up    kitten resize.py up
map alt+shift+down  kitten resize.py down

# Maximize toggle
map cmd+alt+enter toggle_layout stack

# Tabs (ctrl+tab / ctrl+shift+tab are kitty defaults)
map ctrl+shift+t new_tab
map ctrl+shift+w close_window

# Split borders
window_border_width 1pt
active_border_color   #a277ff
inactive_border_color #21202e

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
tab_bar_margin_height 4.0 4.0
tab_bar_margin_width 4.0
tab_title_max_length 30
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index} {title}{' [Z]' if layout_name == 'stack' else ''}"

active_tab_foreground   #15141b
active_tab_background   #a277ff
active_tab_font_style   bold
inactive_tab_foreground #8a889d
inactive_tab_background #21202e
inactive_tab_font_style normal
